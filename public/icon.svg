<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners for Android squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Shield Badge -->
  <path d="M 256,70 L 400,126 C 400,260 338,375 256,432 C 174,375 112,260 112,126 Z" 
        fill="#1e293b" stroke="url(#accent)" stroke-width="12" filter="url(#glow)"/>
        
  <!-- Car Silhouette / Icon -->
  <g fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(146, 175) scale(0.85)">
    <!-- Car body -->
    <path d="M 20,130 C 20,130 35,90 60,80 L 105,45 C 120,32 145,30 180,30 L 210,30 C 235,30 250,40 265,58 L 295,95 C 310,105 320,118 320,135 L 320,165 C 320,175 310,185 300,185 L 290,185 C 290,160 270,145 250,145 C 230,145 210,160 210,185 L 110,185 C 110,160 90,145 70,145 C 50,145 30,160 30,185 L 20,185 C 10,185 0,175 0,165 L 0,145 Z" fill="#0284c7" stroke="#38bdf8"/>
    <!-- Wheels -->
    <circle cx="70" cy="185" r="28" fill="#0f172a" stroke="#22d3ee" stroke-width="8"/>
    <circle cx="70" cy="185" r="10" fill="#38bdf8"/>
    <circle cx="250" cy="185" r="28" fill="#0f172a" stroke="#22d3ee" stroke-width="8"/>
    <circle cx="250" cy="185" r="10" fill="#38bdf8"/>
    <!-- Windows -->
    <path d="M 112,50 L 175,50 L 175,85 L 75,85 Z" fill="#e0f2fe" opacity="0.9"/>
    <path d="M 185,50 L 230,50 L 255,85 L 185,85 Z" fill="#e0f2fe" opacity="0.9"/>
    <!-- Headlights -->
    <circle cx="15" cy="140" r="6" fill="#fbbf24"/>
    <circle cx="305" cy="140" r="6" fill="#ef4444"/>
  </g>
  <!-- Check / Verified emblem -->
  <circle cx="356" cy="340" r="38" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
  <path d="M 342,340 L 352,350 L 372,330" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
